name: Build PR 238 for iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout PR 238
        uses: actions/checkout@v4
        with:
          repository: imaoreo/free-grind
          ref: refs/pull/238/head

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install pnpm (required by Xcode)
        run: npm install -g pnpm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Dependencies
        run: bun install

      - name: Initialize Tauri iOS
        run: bunx tauri ios init

      - name: Build Unsigned App
        run: |
          cd src-tauri/gen/apple
          xcodebuild -project *.xcodeproj -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv src-tauri/gen/apple/build/Release-iphoneos/*.app Payload/
          zip -r free-grind-unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-ios
          path: free-grind-unsigned.ipa
