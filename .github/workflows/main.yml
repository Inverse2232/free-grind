name: Build PR 238 for iOS
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout PR 238
        uses: actions/checkout@v4
        with:
          repository: imaoreo/free-grind
          ref: refs/pull/238/head
      - name: Setup Node & Rust
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: rustup target add aarch64-apple-ios
      - name: Install Dependencies
        run: npm install
      - name: Initialize Tauri iOS
        run: npx tauri ios init
      - name: Build Unsigned App
        run: |
          cd src-tauri/gen/apple
          xcodebuild -project *.xcodeproj -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO clean build
      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv src-tauri/gen/apple/build/Release-iphoneos/*.app Payload/
          zip -r free-grind-unsigned.ipa Payload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-grind-ios
          path: free-grind-unsigned.ipa
