name: Release Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_name: ${{ steps.vars.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: vars
        run: |
          echo "package_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag_name=main-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=Free Grind v$(jq -r '.version' package.json) (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.vars.outputs.tag_name }}',
              name: '${{ steps.vars.outputs.release_name }}',
              body: [
                'Automated release generated from a push to `main`.',
                '',
                `Commit: ${context.sha}`
              ].join('\n'),
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            core.setOutput('release_id', String(data.id));

  build-ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: If you changed to pnpm in your actual file, change these bun steps to pnpm setup/install
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Initialize iOS project
        run: |
          rm -rf src-tauri/gen/apple
          bunx tauri ios init --ci

      - name: Build iOS Rust static library
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release

          LIB_PATH="src-tauri/target/aarch64-apple-ios/release/libopen_grind_lib.a"
          if [ ! -f "$LIB_PATH" ]; then
            echo "iOS static library not found at $LIB_PATH"
            exit 1
          fi

          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/arm64/release/libapp.a

          # Keep xcodebuild happy if the generated project still references both arch outputs.
          mkdir -p src-tauri/gen/apple/Externals/x86_64/release
          cp "$LIB_PATH" src-tauri/gen/apple/Externals/x86_64/release/libapp.a

      - name: Disable Xcode Rust bridge script
        run: |
          PBXPROJ_PATH=$(find src-tauri/gen/apple -maxdepth 3 -name project.pbxproj | head -n 1)
          if [ -z "$PBXPROJ_PATH" ]; then
            echo "project.pbxproj not found under src-tauri/gen/apple"
            exit 1
          fi

          tmp_file="$(mktemp)"
          if ! awk '
            BEGIN { replaced = 0 }
            /tauri ios xcode-script/ {
              print "\t\t\tshellScript = \"set -e\\nLIB_PATH=\\\"$SRCROOT/Externals/arm64/release/libapp.a\\\"\\nif [ ! -f \\\"$LIB_PATH\\\" ]; then\\n  echo \\\"Missing prebuilt Rust library at $LIB_PATH\\\"\\n  exit 1\\nfi\";"
              replaced = 1
              next
            }
            { print }
            END {
              if (replaced == 0) {
                exit 2
              }
            }
          ' "$PBXPROJ_PATH" > "$tmp_file"; then
            rm -f "$tmp_file"
            echo "Failed to replace Build Rust Code script"
            exit 1
          fi

          mv "$tmp_file" "$PBXPROJ_PATH"

          if ! grep -q -- 'Missing prebuilt Rust library' "$PBXPROJ_PATH"; then
            echo "Failed to replace Build Rust Code script"
            exit 1
          fi

          if ! plutil -lint "$PBXPROJ_PATH" >/dev/null; then
            echo "Patched project.pbxproj is invalid"
            exit 1
          fi

          echo "Patched Build Rust Code script to use prebuilt libapp.a"

      - name: Build iOS app without code signing
        id: ios_app
        env:
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: |
          IOS_PROJECT_DIR="src-tauri/gen/apple"
          WORKSPACE_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcworkspace' | head -n 1)
          XCODEPROJ_PATH=$(find "$IOS_PROJECT_DIR" -maxdepth 2 -name '*.xcodeproj' | head -n 1)

          if [ -n "$WORKSPACE_PATH" ]; then
            PROJECT_ARGS=(-workspace "$WORKSPACE_PATH")
          elif [ -n "$XCODEPROJ_PATH" ]; then
            PROJECT_ARGS=(-project "$XCODEPROJ_PATH")
          else
            echo "No Xcode workspace/project found under $IOS_PROJECT_DIR"
            exit 1
          fi

          SCHEME=$(xcodebuild "${PROJECT_ARGS[@]}" -list \
            | awk '/Schemes:/ {flag=1; next} flag && NF {gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print}')

          IOS_SCHEME=$(printf '%s\n' "$SCHEME" | grep -Ei '(^|_|-)ios$|_iOS$|iOS' | head -n 1 || true)
          if [ -n "$IOS_SCHEME" ]; then
            SCHEME="$IOS_SCHEME"
          else
            SCHEME=$(printf '%s\n' "$SCHEME" | head -n 1)
          fi

          if [ -z "$SCHEME" ]; then
            echo "Failed to resolve iOS scheme"
            exit 1
          fi

          echo "Using iOS scheme: $SCHEME"

          DERIVED_DATA_PATH="$RUNNER_TEMP/ios-derived"
          xcodebuild "${PROJECT_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 2 -type d -name '*.app' | grep -E '/(release|Release)-iphoneos/' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No release .app artifact found in $DERIVED_DATA_PATH/Build/Products"
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        id: ios_ipa
        run: |
          APP_PATH='${{ steps.ios_app.outputs.app_path }}'
          if [ -z "$APP_PATH" ] \vert{}\vert{} [ ! -d "$APP_PATH" ]; then
            echo "Cannot package IPA; app bundle missing at $APP_PATH"
            exit 1
          fi

          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/free-grind-unsigned.ipa"

          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload iOS IPA to release
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          IPA_PATH: ${{ steps.ios_ipa.outputs.ipa_path }}
        with:
          script: |
            const fs = require('fs');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            const ipaPath = process.env.IPA_PATH;

            if (!ipaPath || !fs.existsSync(ipaPath)) {
              throw new Error(`IPA not found at ${ipaPath}`);
            }

            const ipaName = `free-grind-v${version}-unsigned.ipa`;
            const fileData = fs.readFileSync(ipaPath);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              name: ipaName,
              data: fileData,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fileData.length
              }
            });

            console.log(`✓ Unsigned iOS IPA uploaded to release as ${ipaName}`);
